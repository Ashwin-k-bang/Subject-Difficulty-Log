<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b3457">
<meta name="apple-mobile-web-app-title" content="Question Bank">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Question Bank</title>
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#0a0a0a;--mute:#767676;--line:#e3e3e3;--acc:#0a0a0a;--on:#fff;--easy:#bdbdbd;--hard:#737373;--hardest:#0a0a0a;--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Inter,Arial,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#131313;--ink:#f5f5f5;--mute:#8a8a8a;--line:#262626;--acc:#f5f5f5;--on:#0a0a0a;--easy:#555;--hard:#9a9a9a;--hardest:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--serif);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 120px}
h1{font-size:40px;font-weight:400;letter-spacing:-.03em;line-height:1.1;margin:12px 0 22px}
h2{font-size:26px;font-weight:400;letter-spacing:-.02em;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:.02em;background:var(--acc);color:var(--on);border:1px solid var(--acc);border-radius:999px;padding:11px 20px;cursor:pointer;transition:opacity .15s,background .15s,color .15s,border-color .15s}
button:hover{opacity:.85}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover{opacity:1;border-color:var(--ink)}
button.sm{padding:7px 14px;font-size:12.5px}
button.bad{border-style:dashed;border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
input[type=text],input[type=password],textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:12px 2px;font-size:17px}
textarea{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--mute)}
input[type=checkbox]{accent-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.subj{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0;cursor:pointer;transition:border-color .15s,transform .15s}
.subj:hover{border-color:var(--ink)}
.subj b{font-weight:400;font-size:21px;letter-spacing:-.01em}
.subj small{color:var(--mute);font:12px var(--sans);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;color:var(--mute);border:0;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 14px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tab:hover{opacity:1;color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tab.add{font-style:italic;text-transform:none;letter-spacing:.02em}
.qa{display:flex;flex-direction:column;gap:8px;align-self:flex-start}
.dt{letter-spacing:1px;font-size:8px;margin-right:7px;vertical-align:2px}
.q{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:16px;margin:12px 0}
.n{font:13px var(--sans);letter-spacing:.06em;min-width:2.2ch;color:var(--mute);padding-top:3px}
.qb{flex:1;min-width:0}
.qb img{max-width:100%;background:#fff;border-radius:8px;display:block;border:1px solid var(--line)}
.qb p{margin:0;white-space:pre-wrap;word-wrap:break-word}
.d{color:var(--mute);font:11.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;margin-top:10px}
.stl{color:var(--mute);font:13px var(--sans);margin:0 0 10px;min-height:1.5em}
.stl.err{color:var(--ink);text-decoration:underline dashed;text-underline-offset:3px}
.f{display:block;margin:16px 0;font:11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.f input{margin-top:2px;color:var(--ink);text-transform:none;letter-spacing:0}
.help{font:13.5px/1.5 var(--sans);color:var(--mute);margin:10px 0}
.empty{color:var(--mute);text-align:center;padding:56px 0;font-style:italic}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));padding:15px 26px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;z-index:9}
.ov.on{display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:900px;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));max-height:95vh;overflow:auto}
#cv{width:100%;height:55vh;background:#fff;border:1px solid var(--line);border-radius:14px;touch-action:none;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.tools label{font:13px var(--sans);color:var(--mute)}
.sw{width:28px;height:28px;border-radius:50%;padding:0;border:1px solid var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.tg{display:inline-block;font:11.5px var(--sans);letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:8px 6px 0 0;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:8px;font:13.5px var(--sans);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;margin:0 8px 8px 0}
.chip span{cursor:pointer}
.chip b{font-weight:400;cursor:pointer;color:var(--mute);padding:0 6px;font-size:16px;line-height:1}
.chip b:hover{color:var(--ink)}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
const DEF=[['easy','Easy'],['hard','Hard'],['hardest','Hardest']];
const DOT={easy:'\u25CF\u25CB\u25CB',hard:'\u25CF\u25CF\u25CB',hardest:'\u25CF\u25CF\u25CF'};
const COL={easy:'var(--easy)',hard:'var(--hard)',hardest:'var(--hardest)'};
let S={subjects:[],tomb:{}},cur=null,curT=null,lvl='hard',editing=null;
const tcol=t=>COL[t.id]||'var(--hard)';
const tabsOf=t=>[...t.tabs].sort((a,b)=>a.ord-b.ord);
const cs=()=>S.subjects.find(x=>x.id===cur);
const ct=()=>{const s=cs();return s&&s.topics.find(x=>x.id===curT)};
function fix(){
  if(cur&&!cs())cur=null;
  if(!cur)curT=null;else if(curT&&!ct())curT=null;
}
/* A subject holds topics; each topic holds tabs and the questions in them. */
function normTopic(t){
  if(!t.tabs)t.tabs=DEF.map(([id,name],i)=>({id,name,ord:i,mod:0}));
  t.q=t.q||{};t.mod=t.mod||0;t.ord=t.ord||0;
  t.tabs.forEach(x=>{if(!t.q[x.id])t.q[x.id]=[]});
  return t;
}
function norm(s){
  s.mod=s.mod||0;s.sources=s.sources||[];
  if(!s.topics)s.topics=(s.tabs||s.q)?[{id:'gen-'+s.id,name:'General',ord:0,mod:0,tabs:s.tabs,q:s.q}]:[];
  delete s.tabs;delete s.q;
  s.topics=s.topics.map(normTopic);
  return s;
}
function normAll(d){d.subjects=(d.subjects||[]).map(norm);d.tomb=d.tomb||{};return d}

/* ---------- storage (IndexedDB) ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('qbank',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=rej});
async function kvGet(k){const db=await idb;return new Promise(r=>{const g=db.transaction('kv').objectStore('kv').get(k);g.onsuccess=()=>r(g.result)})}
async function kvSet(k,v){const db=await idb;return new Promise(r=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})}
async function kvDel(k){const db=await idb;return new Promise(r=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>r()})}
const load=()=>kvGet('s');
const saveLocal=()=>kvSet('s',S);
function save(){saveLocal();schedulePush()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
const $=id=>document.getElementById(id);

/* ---------- GitHub sync ---------- */
/* Config (repo, branch, path, token) is kept in its own IndexedDB key on this device only.
   It is NOT part of "Export backup". Sync merges by id, so nothing is lost when two devices
   edit at once; deletions are tracked in S.tomb so they propagate. */
let CFG=null,syncing=false,again=false,pushT=null,pendingRender=false,st={t:'',err:false};

function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b){const s=atob(b.replace(/\s/g,'')),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new TextDecoder().decode(u)}

function api(q,o={}){
  const p=CFG.path.split('/').map(encodeURIComponent).join('/');
  return fetch(`https://api.github.com/repos/${CFG.repo}/contents/${p}${q}`,{
    cache:'no-store',method:o.method||'GET',body:o.body,
    headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github.object+json','X-GitHub-Api-Version':'2022-11-28',...(o.headers||{})}
  });
}
async function ghErr(r){
  let m='';try{m=(await r.json()).message||''}catch{}
  const h={401:'GitHub rejected the token (wrong or expired).',403:'GitHub refused the request: '+m,404:'Not found. Check the repo name and branch, and that the token has access to this repo.'}[r.status];
  return new Error(h||('GitHub error '+r.status+': '+m));
}
async function pull(){
  const q=CFG.branch?'?ref='+encodeURIComponent(CFG.branch):'';
  const r=await api(q);
  if(r.status===404)return{sha:null,data:null};
  if(!r.ok)throw await ghErr(r);
  const j=await r.json();
  let txt=j.content?b64dec(j.content):'';
  if(!txt&&j.size>0){const r2=await api(q,{headers:{Accept:'application/vnd.github.raw+json'}});if(!r2.ok)throw await ghErr(r2);txt=await r2.text()}
  let data=null;
  if(txt.trim()){try{data=JSON.parse(txt)}catch{throw new Error('The file in the repo is not valid JSON.')}}
  return{sha:j.sha,data};
}
function put(sha){
  const body={message:'Sync question bank',content:b64enc(JSON.stringify(S))};
  if(CFG.branch)body.branch=CFG.branch;
  if(sha)body.sha=sha;
  return api('',{method:'PUT',headers:{'Content-Type':'application/json',Accept:'application/vnd.github+json'},body:JSON.stringify(body)});
}
const newer=(x,y)=>(y.mod||0)>(x.mod||0);
function mergeBox(m,s,tomb){
  for(const t of s.tabs||[]){
    if(tomb[m.id+'/'+t.id])continue;
    const e=m.tabs.find(x=>x.id===t.id);
    if(!e)m.tabs.push({...t});else if(newer(e,t))Object.assign(e,t);
  }
  for(const k in (s.q||{})){
    if(tomb[m.id+'/'+k])continue;
    const arr=m.q[k]=m.q[k]||[];
    for(const q of s.q[k]){
      if(tomb[q.id])continue;
      const i=arr.findIndex(x=>x.id===q.id);
      if(i<0)arr.push(q);else if(newer(arr[i],q))arr[i]=q;
    }
  }
}
function merge(a,b){
  const tomb={...(a.tomb||{})};
  for(const k in (b.tomb||{}))tomb[k]=Math.max(tomb[k]||0,b.tomb[k]);
  const out=[],map=new Map();
  for(const s of [...(a.subjects||[]),...(b.subjects||[])]){
    if(tomb[s.id])continue;
    let m=map.get(s.id);
    if(!m){m={id:s.id,name:s.name,mod:s.mod||0,sources:[],topics:[]};map.set(s.id,m);out.push(m)}
    else if(newer(m,s)){m.name=s.name;m.mod=s.mod||0}
    m.sources=m.sources||[];
    for(const r of s.sources||[]){
      if(tomb[r.id])continue;
      const e=m.sources.find(x=>x.id===r.id);
      if(!e)m.sources.push({...r});else if(newer(e,r))Object.assign(e,r);
    }
    for(const t of s.topics||[]){
      if(tomb[t.id])continue;
      let p=m.topics.find(x=>x.id===t.id);
      if(!p){p={id:t.id,name:t.name,ord:t.ord||0,mod:t.mod||0,tabs:[],q:{}};m.topics.push(p)}
      else if(newer(p,t)){p.name=t.name;p.ord=t.ord||0;p.mod=t.mod||0}
      mergeBox(p,t,tomb);
    }
  }
  out.forEach(s=>s.topics.forEach(p=>{
    p.tabs.forEach(t=>{if(!p.q[t.id])p.q[t.id]=[]});
    for(const k of Object.keys(p.q)){
      if(!p.tabs.some(t=>t.id===k))delete p.q[k];else p.q[k].sort((x,y)=>x.ts-y.ts);
    }
  }));
  return{subjects:out,tomb};
}
const byId=(x,y)=>x.id<y.id?-1:1;
const canon=d=>JSON.stringify([
  [...(d.subjects||[])].sort(byId).map(s=>[s.id,s.name,s.mod||0,
    [...(s.sources||[])].sort(byId).map(r=>[r.id,r.name,r.mod||0]),
    [...(s.topics||[])].sort(byId).map(p=>[p.id,p.name,p.ord||0,p.mod||0,
      [...(p.tabs||[])].sort(byId).map(t=>[t.id,t.name,t.ord,t.mod||0]),
      Object.keys(p.q||{}).sort().map(k=>[k,(p.q[k]||[]).map(q=>q.id+':'+(q.mod||0)).sort()])])]),
  Object.keys(d.tomb||{}).sort()
]);

async function sync(){
  if(!CFG)return;
  if(syncing){again=true;return}
  clearTimeout(pushT);syncing=true;updateStatus();
  let changed=false;
  try{
    let ok=false;
    for(let n=0;n<4&&!ok;n++){
      const {sha,data}=await pull();
      if(data&&!Array.isArray(data.subjects))throw new Error('The file in the repo is not a question bank backup.');
      if(data)normAll(data);
      const merged=merge(S,data||{subjects:[],tomb:{}});
      if(canon(merged)!==canon(S)){S=merged;changed=true;await saveLocal()}
      if(data&&canon(data)===canon(S)){ok=true;break}
      const r=await put(sha);
      if(r.ok)ok=true;
      else if(r.status!==409&&r.status!==422)throw await ghErr(r);
    }
    if(!ok)throw new Error('Sync kept conflicting. Try again in a moment.');
    CFG.last=Date.now();await saveCfg();
    setSt('Synced '+fmt(CFG.last));
  }catch(e){
    setSt(e.name==='TypeError'?'Can\u2019t reach GitHub. Will retry when you\u2019re online.':e.message,true);
  }finally{
    syncing=false;updateStatus();
    if(changed)afterSync();
    if(again){again=false;schedulePush()}
  }
}
const saveCfg=()=>kvSet('cfg',CFG);
function schedulePush(){if(!CFG)return;clearTimeout(pushT);pushT=setTimeout(sync,1500)}
function setSt(t,err){st={t,err:!!err};updateStatus()}
function updateStatus(){
  const e=$('sm');
  if(e){e.textContent=syncing?'Syncing\u2026':(st.err?st.t:(CFG?'Connected. Your data is saved to GitHub.':''));e.className='stl'+(st.err?' err':'')}
  const b=$('sy');
  if(b){
    b.textContent=!CFG?'Set up sync':syncing?'Syncing\u2026':st.err?'Sync failed':'Synced';
    b.className='ghost sm'+(CFG&&st.err&&!syncing?' bad':'');
  }
}
function afterSync(){
  fix();
  if($('ov').classList.contains('on'))pendingRender=true;else renderKeep();
}
function renderKeep(){const ids=['ns','nt','nsr'],v=ids.map(i=>$(i)?$(i).value:'');render();ids.forEach((i,k)=>{if(v[k]&&$(i))$(i).value=v[k]})}

function openSettings(){
  const c=CFG||{repo:'Ashwin-k-bang/Subject-Difficulty-Log',branch:'',path:'data/question-bank.json',token:''};
  const [ou,on]=(c.repo||'/').split('/');
  const P=CFG?'Saved \u2014 leave blank to keep':'github_pat_\u2026';
  $('sheet').innerHTML=`<h2>Sync across devices</h2>
  <p class="help">Your question bank is saved in this GitHub repo (<code>${esc(c.path)}</code>), so every device shows the same data. Each device needs the token once.</p>
  <label class="f">GitHub username<input type="text" id="gu" value="${esc(ou||'')}" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
  <label class="f">Repository name<input type="text" id="gr" value="${esc(on||'')}" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
  <label class="f">Branch (leave empty for the default)<input type="text" id="gb" value="${esc(c.branch||'')}" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
  <label class="f">Access token<input type="password" id="gt" placeholder="${P}" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <ol class="help" style="padding-left:20px;margin:0">
    <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a></li>
    <li>Repository access: <b>Only select repositories</b>, pick this repo</li>
    <li>Permissions \u2192 Repository \u2192 <b>Contents: Read and write</b></li>
    <li>Generate, copy, paste above</li>
  </ol>
  <div class="stl" id="sm" role="status" style="margin-top:12px"></div>
  <div class="row" style="margin-top:8px">${CFG?'<button class="ghost" id="dc">Remove token</button>':''}<button class="ghost" id="x">Close</button><button id="go">Save &amp; sync</button></div>`;
  $('ov').classList.add('on');
  $('x').onclick=closeSheet;
  updateStatus();
  if($('dc'))$('dc').onclick=async()=>{
    if(!confirm('Remove the token and stop syncing on this device? Your local questions and the GitHub file are kept.'))return;
    CFG=null;clearTimeout(pushT);await kvDel('cfg');st={t:'',err:false};closeSheet();render();
  };
  $('go').onclick=async()=>{
    const user=$('gu').value.trim().replace(/^@/,''),name=$('gr').value.trim().replace(/\.git$/i,'');
    const repo=user+'/'+name;
    const branch=$('gb').value.trim();
    const token=$('gt').value.trim()||(CFG&&CFG.token)||'';
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){alert('Enter your GitHub username and the repository name.');return}
    if(!token){alert('Paste your GitHub access token.');return}
    CFG={repo,branch,path:c.path,token,last:CFG&&CFG.last};
    await saveCfg();closeSheet();render();sync();
  };
}

/* ---------- views ---------- */
function render(){
  const a=$('app');
  if(!cur){
    a.innerHTML=`<div class="row"><h1 class="sp">Question Bank</h1><button class="ghost sm" id="sy"></button></div>
    <div class="row"><input type="text" id="ns" placeholder="New subject name" aria-label="New subject name"><button id="addS">Add subject</button></div>
    <div id="sl">${S.subjects.length?S.subjects.map(s=>`<div class="subj" data-id="${s.id}"><div><b>${esc(s.name)}</b><br><small>${s.topics.length} topic${s.topics.length===1?'':'s'}</small></div><div class="row"><button class="ghost sm" data-ren="${s.id}">Rename</button><button class="ghost sm" data-del="${s.id}">Delete</button></div></div>`).join(''):'<div class="empty">Add your first subject to start collecting questions.</div>'}</div>
    <div class="row" style="margin-top:24px;flex-wrap:wrap"><button class="ghost sm" id="exp">Export backup</button><label class="ghost sm" style="border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer">Import backup<input type="file" id="imp" accept=".json" hidden></label></div>`;
    $('addS').onclick=addSubject;
    $('ns').onkeydown=e=>{if(e.key==='Enter')addSubject()};
    $('sy').onclick=openSettings;
    a.querySelectorAll('.subj').forEach(el=>el.onclick=e=>{
      if(e.target.dataset.ren){renameSubject(e.target.dataset.ren);return}
      if(e.target.dataset.del){if(confirm('Delete this subject and all its questions?')){S.tomb[e.target.dataset.del]=Date.now();S.subjects=S.subjects.filter(s=>s.id!==e.target.dataset.del);save();render()}return}
      cur=el.dataset.id;curT=null;render()});
    $('exp').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='question-bank-backup.json';u.click()};
    $('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.subjects))throw 0;d.tomb=d.tomb||{};S=normAll(d);await saveLocal();schedulePush();render()}catch{alert('That file is not a valid backup.')}};
    updateStatus();
    return;
  }
  const s=cs();
  if(!curT){
    const tps=[...s.topics].sort((x,y)=>x.ord-y.ord);
    a.innerHTML=`<div class="row"><button class="ghost sm" id="back">Back</button><h2 class="sp">${esc(s.name)}</h2><button class="ghost sm" id="rs">Rename</button><button class="ghost sm" id="sy"></button></div>
    <div class="row" style="margin-top:22px"><input type="text" id="nt" placeholder="New topic name" aria-label="New topic name"><button id="addT">Add topic</button></div>
    <div style="margin-top:26px"><div class="f" style="margin:0 0 8px">Sources</div><div>${(s.sources||[]).length?[...s.sources].sort((x,y)=>x.name.localeCompare(y.name)).map(r=>`<span class="chip"><span data-sn="${r.id}" title="Rename">${esc(r.name)}</span><b data-sx="${r.id}" role="button" aria-label="Delete source ${esc(r.name)}">\u00D7</b></span>`).join(''):'<p class="help" style="margin:0 0 8px">Add sources (books, test series, previous papers). They show up as tag buttons whenever you add a question in this subject.</p>'}</div><div class="row" style="margin-top:6px"><input type="text" id="nsr" placeholder="New source name" aria-label="New source name"><button class="ghost" id="addSr">Add</button></div></div>
    <div style="margin-top:22px">${tps.length?tps.map(t=>`<div class="subj" data-id="${t.id}"><div><b>${esc(t.name)}</b><br><small>${tabsOf(t).map(x=>esc(x.name)+' '+(t.q[x.id]||[]).length).join(' \u00B7 ')||'No tabs'}</small></div><div class="row"><button class="ghost sm" data-ren="${t.id}">Rename</button><button class="ghost sm" data-del="${t.id}">Delete</button></div></div>`).join(''):'<div class="empty">Add your first topic. Each topic has its own tabs and questions.</div>'}</div>`;
    $('back').onclick=()=>{cur=null;render()};
    $('sy').onclick=openSettings;
    $('rs').onclick=()=>renameSubject(s.id);
    $('addT').onclick=addTopic;
    $('nt').onkeydown=e=>{if(e.key==='Enter')addTopic()};
    $('addSr').onclick=addSource;
    $('nsr').onkeydown=e=>{if(e.key==='Enter')addSource()};
    a.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>renameSource(b.dataset.sn));
    a.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>deleteSource(b.dataset.sx));
    a.querySelectorAll('.subj').forEach(el=>el.onclick=e=>{
      if(e.target.dataset.ren){renameTopic(e.target.dataset.ren);return}
      if(e.target.dataset.del){deleteTopic(e.target.dataset.del);return}
      curT=el.dataset.id;render()});
    updateStatus();
    return;
  }
  const tp=ct(),tabs=tabsOf(tp);
  if(!tabs.some(t=>t.id===lvl))lvl=tabs.length?tabs[0].id:null;
  const tb=tabs.find(t=>t.id===lvl),list=tb?tp.q[tb.id]:[],c=tb?tcol(tb):'var(--hard)';
  a.innerHTML=`<div class="row"><button class="ghost sm" id="back">Back</button><h2 class="sp">${esc(tp.name)}</h2><button class="ghost sm" id="rs">Rename</button><button class="ghost sm" id="sy"></button></div>
  <p class="stl" style="margin:6px 0 0">${esc(s.name)}</p>
  <div class="tabs" style="--c:${c}">${tabs.map(t=>`<button class="tab ${t.id===lvl?'on':''}" style="--c:${tcol(t)}" data-l="${t.id}">${DOT[t.id]?`<span class="dt">${DOT[t.id]}</span>`:''}${esc(t.name)} (${(tp.q[t.id]||[]).length})</button>`).join('')}<button class="tab add" id="at" aria-label="Add tab">+ Tab</button></div>
  ${tb?`<div class="row" style="margin-bottom:6px"><button class="ghost sm" id="rt">Rename tab</button><button class="ghost sm" id="dtab">Delete tab</button></div>`:''}
  <div style="--c:${c}">${list.length?list.map((q,i)=>`<div class="q"><div class="n">${i+1}.</div><div class="qb">${q.img?`<img src="${q.img}" alt="Handwritten question ${i+1}">`:`<p>${esc(q.text||'')}</p>`}${(q.tags||[]).length?'<div>'+q.tags.map(t=>`<span class="tg">${esc(t)}</span>`).join('')+'</div>':''}<div class="d">Added ${fmt(q.ts)}${q.mod&&q.mod>q.ts+1000?' \u00B7 Edited '+fmt(q.mod):''}</div></div><div class="qa"><button class="ghost sm" data-ed="${q.id}" aria-label="Edit question ${i+1}">Edit</button><button class="ghost sm" data-rm="${q.id}" aria-label="Delete question ${i+1}">Delete</button></div></div>`).join(''):`<div class="empty">${tb?'No questions here yet.':'No tabs yet. Tap + Tab to add one.'}</div>`}</div>
  ${tb?'<button class="fab" id="add">+ Add question</button>':''}`;
  $('back').onclick=()=>{curT=null;render()};
  $('sy').onclick=openSettings;
  $('rs').onclick=()=>renameTopic(tp.id);
  $('at').onclick=()=>addTab(tp);
  a.querySelectorAll('.tab[data-l]').forEach(b=>b.onclick=()=>{lvl=b.dataset.l;render()});
  if(tb){
    $('rt').onclick=()=>renameTab(tp,tb);
    $('dtab').onclick=()=>deleteTab(tp,tb);
    $('add').onclick=()=>openAdd();
    a.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>openAdd(b.dataset.ed));
    a.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(confirm('Delete this question?')){S.tomb[b.dataset.rm]=Date.now();tp.q[tb.id]=tp.q[tb.id].filter(q=>q.id!==b.dataset.rm);save();render()}});
  }
  updateStatus();
}
function addSubject(){const v=$('ns').value.trim();if(!v)return;S.subjects.push({id:uid(),name:v,mod:Date.now(),topics:[]});save();render()}
const hasSrc=(s,n)=>(s.sources||[]).some(r=>r.name.toLowerCase()===n.toLowerCase());
function addSource(){
  const v=$('nsr').value.trim();if(!v)return;
  const s=cs();
  if(hasSrc(s,v)){alert('That source already exists.');return}
  s.sources.push({id:uid(),name:v,mod:Date.now()});
  save();render();
}
function renameSource(id){
  const s=cs(),r=s.sources.find(x=>x.id===id);if(!r)return;
  const v=prompt('Rename source (questions already tagged with it are updated too)',r.name);if(v===null)return;
  const n=v.trim();if(!n||n===r.name)return;
  if(hasSrc(s,n)&&n.toLowerCase()!==r.name.toLowerCase()){alert('That source already exists.');return}
  const old=r.name,now=Date.now();
  r.name=n;r.mod=now;
  s.topics.forEach(t=>Object.values(t.q).forEach(l=>l.forEach(q=>{
    if(q.tags&&q.tags.includes(old)){q.tags=q.tags.map(x=>x===old?n:x);q.mod=now}
  })));
  save();render();
}
function deleteSource(id){
  const s=cs(),r=s.sources.find(x=>x.id===id);if(!r)return;
  if(!confirm('Delete the source "'+r.name+'"? Questions already tagged with it keep their tag.'))return;
  S.tomb[id]=Date.now();
  s.sources=s.sources.filter(x=>x.id!==id);
  save();render();
}
function addTopic(){
  const v=$('nt').value.trim();if(!v)return;
  const s=cs();
  s.topics.push(normTopic({id:uid(),name:v,ord:Math.max(-1,...s.topics.map(t=>t.ord))+1,mod:Date.now()}));
  save();render();
}
function renameTopic(id){
  const t=cs().topics.find(x=>x.id===id);if(!t)return;
  const v=prompt('Rename topic',t.name);if(v===null)return;
  const n=v.trim();if(!n||n===t.name)return;
  t.name=n;t.mod=Date.now();save();render();
}
function deleteTopic(id){
  const s=cs(),t=s.topics.find(x=>x.id===id);if(!t)return;
  const n=Object.values(t.q).reduce((a,l)=>a+l.length,0);
  if(!confirm('Delete the topic "'+t.name+'"'+(n?' and its '+n+' question'+(n>1?'s':''):'')+'?'))return;
  S.tomb[id]=Date.now();
  s.topics=s.topics.filter(x=>x.id!==id);
  if(curT===id)curT=null;
  save();render();
}
function renameSubject(id){
  const s=S.subjects.find(x=>x.id===id);if(!s)return;
  const v=prompt('Rename subject',s.name);if(v===null)return;
  const n=v.trim();if(!n||n===s.name)return;
  s.name=n;s.mod=Date.now();save();render();
}
function addTab(s){
  const v=prompt('New tab name');if(v===null)return;
  const n=v.trim();if(!n)return;
  const id=uid();
  s.tabs.push({id,name:n,ord:Math.max(-1,...s.tabs.map(t=>t.ord))+1,mod:Date.now()});
  s.q[id]=[];lvl=id;save();render();
}
function renameTab(s,t){
  const v=prompt('Rename tab',t.name);if(v===null)return;
  const n=v.trim();if(!n||n===t.name)return;
  t.name=n;t.mod=Date.now();save();render();
}
function deleteTab(s,t){
  const list=s.q[t.id]||[];
  if(!confirm('Delete the tab "'+t.name+'"'+(list.length?' and its '+list.length+' question'+(list.length>1?'s':''):'')+'?'))return;
  const now=Date.now();
  S.tomb[s.id+'/'+t.id]=now;list.forEach(q=>S.tomb[q.id]=now);
  s.tabs=s.tabs.filter(x=>x.id!==t.id);delete s.q[t.id];
  save();render();
}
function push(item){
  item={...item,tags:selTags.slice()};
  const s=ct();
  if(!s||!s.q[lvl]){closeSheet();fix();render();return}
  const now=Date.now();
  if(editing){
    const q=s.q[lvl].find(x=>x.id===editing);
    if(q){delete q.text;delete q.img;Object.assign(q,item,{mod:now})}
  }else s.q[lvl].push({id:uid(),ts:now,mod:now,...item});
  save();closeSheet();render();
}

/* ---------- add / edit sheet ---------- */
function closeSheet(){
  editing=null;
  $('ov').classList.remove('on');$('sheet').innerHTML='';
  if(pendingRender){pendingRender=false;fix();renderKeep()}
}
let selTags=[];
function drawSrcs(){
  const el=$('srcs');if(!el)return;
  const names=(cs().sources||[]).map(r=>r.name).sort((x,y)=>x.localeCompare(y));
  selTags.forEach(t=>{if(!names.includes(t))names.push(t)});
  el.innerHTML=(names.length?'<label>Sources</label>':'')+names.map((n,i)=>`<button class="sm ${selTags.includes(n)?'':'ghost'}" data-i="${i}" aria-pressed="${selTags.includes(n)}">${esc(n)}</button>`).join('')+'<button class="ghost sm bad" id="nsrc">+ New source</button>';
  el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const n=names[b.dataset.i],k=selTags.indexOf(n);
    if(k<0)selTags.push(n);else selTags.splice(k,1);
    drawSrcs();
  });
  $('nsrc').onclick=()=>{
    const v=prompt('New source name');if(v===null)return;
    const n=v.trim();if(!n)return;
    const s=cs(),e=(s.sources||[]).find(r=>r.name.toLowerCase()===n.toLowerCase());
    const name=e?e.name:n;
    if(!e){s.sources.push({id:uid(),name:n,mod:Date.now()});save()}
    if(!selTags.includes(name))selTags.push(name);
    drawSrcs();
  };
}
function openAdd(qid){
  const s=ct(),t=s.tabs.find(x=>x.id===lvl);
  editing=qid||null;
  const q=qid?s.q[lvl].find(x=>x.id===qid):null;
  selTags=q&&q.tags?[...q.tags]:[];
  $('sheet').innerHTML=`<div class="row"><h2>${q?'Edit question':'Add to '+esc(t.name)}</h2><span class="sp"></span><button class="ghost sm" id="x">Cancel</button></div>
  <div class="row" style="margin:12px 0"><button id="mt" class="sp">Type</button><button id="mw" class="ghost sp">Write</button></div><div id="srcs" class="tools" style="margin:0 0 12px"></div><div id="body"></div>`;
  $('ov').classList.add('on');
  drawSrcs();
  $('x').onclick=closeSheet;
  $('mt').onclick=()=>typeMode();$('mw').onclick=()=>writeMode();
  if(q&&q.img)writeMode(q.img);else typeMode(q&&q.text);
}
function mode(t){$('mt').className=t==='t'?'sp':'ghost sp';$('mw').className=t==='w'?'sp':'ghost sp'}
function typeMode(txt){
  mode('t');
  $('body').innerHTML=`<textarea id="tx" rows="6" placeholder="Type the question" aria-label="Question text"></textarea><div class="row" style="margin-top:10px"><span class="sp"></span><button id="sv">Save</button></div>`;
  $('tx').value=txt||'';$('tx').focus();
  $('sv').onclick=()=>{const t=$('tx').value.trim();if(t)push({text:t})};
}

/* ---------- handwriting canvas ---------- */
let strokes=[],drawing=null,color='#111111',erase=false,w=3;
function writeMode(base){
  mode('w');strokes=[];erase=false;color='#111111';let bimg=null;
  $('body').innerHTML=`<canvas id="cv"></canvas>
  <div class="tools">
    ${['#111111','#6b6b6b','#b0b0b0'].map(c=>`<button class="sw ${c===color?'on':''}" style="background:${c}" data-c="${c}" aria-label="Pen color ${c}"></button>`).join('')}
    <button class="ghost sm" id="er">Eraser</button>
    <button class="ghost sm" id="un">Undo</button>
    <button class="ghost sm" id="cl">Clear</button>
    <label><input type="checkbox" id="po" checked> Pencil only (ignore finger)</label>
    <span class="sp"></span><button id="sv">Save</button>
  </div>`;
  const cv=$('cv'),ctx=cv.getContext('2d');
  const size=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;redraw()};
  function seg(st){
    const d=devicePixelRatio||1;
    ctx.globalCompositeOperation=st.e?'destination-out':'source-over';
    ctx.strokeStyle=st.c;ctx.fillStyle=st.c;ctx.lineCap=ctx.lineJoin='round';
    const p=st.p;
    if(p.length===1){ctx.beginPath();ctx.arc(p[0][0]*d,p[0][1]*d,st.w*d*(st.e?4:.6),0,7);ctx.fill();return}
    for(let i=1;i<p.length;i++){ctx.lineWidth=(st.e?st.w*6:st.w*(.5+p[i][2]))*d;ctx.beginPath();ctx.moveTo(p[i-1][0]*d,p[i-1][1]*d);ctx.lineTo(p[i][0]*d,p[i][1]*d);ctx.stroke()}
  }
  function redraw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    if(bimg){const d=devicePixelRatio||1,sc=Math.min(1,(cv.width-24*d)/bimg.width,(cv.height-24*d)/bimg.height);ctx.globalCompositeOperation='source-over';ctx.drawImage(bimg,12*d,12*d,bimg.width*sc,bimg.height*sc)}
    strokes.forEach(seg);
  }
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top,e.pointerType==='pen'&&e.pressure?e.pressure:.5]};
  cv.onpointerdown=e=>{
    if(e.pointerType==='touch'&&$('po').checked)return;
    e.preventDefault();cv.setPointerCapture(e.pointerId);
    drawing={c:color,w,e:erase,p:[pt(e)]};strokes.push(drawing);redraw();
  };
  cv.onpointermove=e=>{if(!drawing)return;e.preventDefault();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>drawing.p.push(pt(ev)));redraw()};
  const end=()=>{drawing=null};
  cv.onpointerup=cv.onpointercancel=end;
  cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b));$('er').className='ghost sm'});
  $('er').onclick=()=>{erase=!erase;$('er').className=erase?'sm':'ghost sm'};
  $('un').onclick=()=>{strokes.pop();redraw()};
  $('cl').onclick=()=>{strokes=[];bimg=null;redraw()};
  $('sv').onclick=()=>{
    const W=cv.width,H=cv.height,px=ctx.getImageData(0,0,W,H).data;
    let x0=W,y0=H,x1=-1,y1=-1;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(px[(y*W+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1<0){alert('Write something first.');return}
    const pad=Math.round(12*(devicePixelRatio||1));
    x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
    const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;
    const oc=o.getContext('2d');oc.fillStyle='#fff';oc.fillRect(0,0,o.width,o.height);
    oc.drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);
    push({img:o.toDataURL('image/png')});
  };
  if(base){const im=new Image();im.onload=()=>{bimg=im;redraw()};im.src=base}
  requestAnimationFrame(size);
  addEventListener('resize',size);
}

/* ---------- init ---------- */
(async()=>{
  try{const d=await load();if(d)S=d;normAll(S);CFG=(await kvGet('cfg'))||null}catch{}
  if(CFG&&CFG.last)st.t='Last synced '+fmt(CFG.last);
  render();
  if(CFG)sync();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CFG)sync()});
addEventListener('online',()=>{if(CFG)sync()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script>
</body>
</html>
